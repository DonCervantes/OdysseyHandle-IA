[project]
name = "autoguard"
version = "0.1.0"
description = "KAVAK AUTOGUARD AI — verificación, cotización y auto-mejora recursiva (RSI). Datos simulados."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "gitpython>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "anthropic>=0.40",
  "langgraph>=0.2",
  "streamlit>=1.38",
  "plotly>=5.22",
  "pillow>=10.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
